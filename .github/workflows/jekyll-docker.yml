| Fasa Aliran Kerja | Status Akhir | Fungsi & Impak Operasi |
|---|---|---|
| Runtime Asli (Ruby 3.2) | Berjaya | Menghapuskan ralat hak akses file (chmod) dan memendekkan masa penyediaan persekitaran. |
| Simpanan Khas (Caching) | Aktif | Menyimpan pakej Ruby Gems secara automatik bagi mengurangkan beban muat turun berulang. |
| Integriti Laman (html-proofer) | Aktif | Menapis dan mengesan jika terdapat pautan (links) atau aset gambar yang rosak pada halaman web. |
| Automasi Deploi (GitHub Pages) | Sedia | Menerbitkan hasil binaan folder _site secara terus ke pelayan awam sebaik sahaja kod digabungkan. |

